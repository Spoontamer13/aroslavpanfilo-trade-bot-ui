name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, main1 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller certifi

      - name: Locate certifi
        shell: bash
        run: |
          python - <<'PY' > cert.path
import certifi, sys
sys.stdout.write(certifi.where())
PY
          echo "CERT_FILE=$(cat cert.path)" >> $GITHUB_ENV

      - name: PyInstaller
        shell: bash
        env:
          CERT_FILE: ${{ env.CERT_FILE }}
        run: |
          echo "Using cert file: $CERT_FILE"
          # ВНИМАНИЕ: в --add-data на Windows разделитель ; (даже под bash)
          pyinstaller --noconfirm --clean \
            --onefile --windowed \
            --name TradeBotUI \
            --paths . \
            --collect-all PySide6 \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            --hidden-import certifi \
            --add-data "config/settings.yaml;config" \
            --add-data "$CERT_FILE;certifi" \
            --add-data "core;core" \
            --add-data "utils;utils" \
            --add-data "ui;ui" \
            ui/main_window.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeBotUI-win
          path: dist/TradeBotUI.exe
